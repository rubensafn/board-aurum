});
/* v43: campos do NOVO POST e dos FILMES guardam o que você digita sem redesenhar (não perde o foco) */
/* v50: horário SEMPRE 24 h (Brasil) — campo de texto com máscara HH:MM, não o relógio AM/PM do navegador */
function h24(v){ const d=String(v||'').replace(/\D/g,'').slice(0,4); if(d.length<3) return d; return d.slice(0,2)+':'+d.slice(2); }
function h24ok(v){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.h24){ const v=h24(t.value); if(v!==t.value) t.value=v; } },true);
document.addEventListener('input',e=>{ const t=e.target; if(t.id==='hin'||t.id==='ehin'){ if(t.value&&!h24ok(t.value)){ const o=$('#'+t.id+'v'); if(o) o.innerHTML=t.value.length<5?'Digita no formato 24 h, ex.: 13:45':'Horário inválido (00:00 a 23:59)'; return; } const p=find(t.dataset.hd), o=$('#'+t.id+'v'); if(p&&o) o.innerHTML=t.value?hInfo(hdOf(p),t.value):'Digita um horário pra ver o alcance dele.'; if(t.id==='ehin'&&S.ed&&/^\d{2}:\d{2}$/.test(t.value)){ S.ed.hora=t.value; const r=$('#edres'); if(r) r.textContent='POSTA '+dayText(S.ed.dia)+' ÀS '+t.value; } return; } /* v50 */
  if(!S.nv) return;
  if(t.id==='nvleg') S.nv.leg=t.value; else if(t.id==='nvped') S.nv.pedido=t.value; else if(t.id==='nvfilmein') S.nv.filme=t.value; });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='nvfile'&&t.files&&t.files.length){ nvArquivos(t.files); t.value=''; }
  else if(t.id==='nvhorain'&&S.nv){ S.nv.hora=h24ok(t.value)?t.value:''; if(t.value&&!h24ok(t.value)) toast('Digita o horário em 24 h (ex.: 18:45)'); nvRender(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='flin'){ e.preventDefault(); filmeAdd(); } });

/* horário: mesmo esquema do calendário (no celular salva ao fechar) */

document.addEventListener('focusout',e=>{ const i=e.target.closest('[data-act="time"]'); if(!i) return; const v=i.value||''; if(v===(i.dataset.orig||'')) return; if(S.sheet) closeSheet(); setHora(i.dataset.id,v||null); });

document.addEventListener('change',e=>{ if(e.target.id==='edate'&&e.target.value){ S.ed.dia=e.target.value; edRefresh(); return; } if(e.target.id==='ehin'&&e.target.value){ S.ed.hora=e.target.value; const r=$('#edres'); if(r) r.textContent='POSTA '+dayText(S.ed.dia)+' ÀS '+S.ed.hora; return; } });
document.addEventListener('change',e=>{ const i=e.target.closest('[data-act="date"]'); if(!i||isMobile()) return; i.dataset.orig=i.value; if(S.sheet) closeSheet(); setDia(i.dataset.id,i.value||null); });

/* v29: troca de aba com cara de troca de página — os posts (e a linha de dias) saem deslizando pro lado e a aba nova entra do outro lado */
let vAnim=0;
async function goView(v){
  if(v===S.view) return; const O={pend:0,resv:1,apr:2,done:3}, d=O[v]>O[S.view]?1:-1, my=++vAnim;
  S.view=v; store.set('fila_view',v); ['pend','resv','apr','done'].forEach(k=>$('#tab-'+k).classList.toggle('on',k===v)); moveInd(); if(v==='resv') abrirResv();
  const els=[$('#list'),document.querySelector('.daysbar')].filter(Boolean);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!els[0].animate){ render(); window.scrollTo({top:0}); return; }
  const out=els.map(e=>e.animate([{transform:'none',opacity:1},{transform:`translateX(${-d*56}px)`,opacity:0}],{duration:170,easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'}));
  await Promise.all(out.map(a=>a.finished.catch(()=>{}))); if(my!==vAnim) return;
  render(); window.scrollTo({top:0});
  els.forEach((e,i)=>{ out[i].cancel(); e.animate([{transform:`translateX(${d*56}px)`,opacity:0},{transform:'none',opacity:1}],{duration:340,easing:'cubic-bezier(.16,.84,.3,1)'}); });
}

$('#logo').addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));

  clearInterval(poll); poll=setInterval(()=>{ if(!readSession()){logout('Sessão expirada, entra de novo');return;} if(!document.hidden) load(); },30000);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden||!S.pin) return; if(!readSession()) logout('Sessão expirada, entra de novo'); else load(); });
start();

/* v59: puxar pra atualizar — no topo da página, puxa pra baixo, solta e recarrega. Não age com pop-up aberto. */
(()=>{const el=document.getElementById('ptr'); if(!el||!matchMedia('(pointer:coarse)').matches) return;
  const GO=72, MAX=110; let y0=null, v=0, busy=false; const svg=el.querySelector('svg');
  const show=(px,anim)=>{el.style.transition=anim?'transform .25s ease,opacity .25s ease':'none'; el.style.transform=`translateY(${px-60}px)`; el.style.opacity=Math.min(1,px/40); el.classList.toggle('ok',px>=GO); if(!busy) svg.style.transform=`rotate(${px*3.2}deg)`;};
  addEventListener('touchstart',e=>{ y0=(busy||window.scrollY>0||lockY!==null||e.touches.length>1)?null:e.touches[0].clientY; },{passive:true});
  addEventListener('touchmove',e=>{ if(y0===null) return; const dy=e.touches[0].clientY-y0; if(dy<=0||window.scrollY>0){v=0;show(0,false);return;} v=Math.min(MAX,dy*.5); show(v,false); },{passive:true});
  const end=()=>{ if(y0===null) return; y0=null; if(v>=GO){ busy=true; svg.style.transform=''; el.classList.add('spin'); show(GO,true); setTimeout(()=>location.reload(),250); } else show(0,true); v=0; };
  addEventListener('touchend',end); addEventListener('touchcancel',end);
})();
